appId: club.hiraeth.unthreader
productName: UnThreader
copyright: Copyright © 2026 Hiraeth Club
publish:
  provider: github
  owner: hiraethclub
  repo: UnThreader
  releaseType: release
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - resources/**
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: Hiraeth Club
  artifactName: ${productName}-${version}.${ext}
mac:
  target:
    - dmg
  category: public.app-category.utilities
  artifactName: ${productName}-${version}.${ext}
