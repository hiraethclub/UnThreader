name: publish-release

# Publishes an existing draft GitHub Release (electron-builder creates the
# release as a draft). Run this after a release build to make it public.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release to publish
        default: v0.1.0
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${{ inputs.tag }}"
          id=$(gh api repos/${{ github.repository }}/releases --paginate \
                --jq "[.[] | select(.tag_name==\"$tag\")][0].id")
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "No release found for tag $tag"; exit 1
          fi
          gh api -X PATCH repos/${{ github.repository }}/releases/$id \
            -F draft=false -f name="UnThreader $tag" >/dev/null
          url=$(gh api repos/${{ github.repository }}/releases/$id --jq .html_url)
          echo "Published: $url"
