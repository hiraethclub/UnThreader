name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run check:injected

      # Compile main/preload/renderer into out/ before packaging.
      - run: npm run build

      # Package this OS's installers and publish them to the GitHub Release for
      # the tag/version. electron-builder creates/updates the release.
      - name: Package and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code-signing in CI — produce unsigned artifacts.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
