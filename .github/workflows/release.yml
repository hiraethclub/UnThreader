name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run check:injected

      # Compile main/preload/renderer into out/ before packaging.
      - run: npm run build

      # Package this OS's installers and publish them to the GitHub Release for
      # the tag/version. electron-builder creates/updates the release.
      - name: Package and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code-signing in CI — produce unsigned artifacts.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  # electron-builder uploads to a DRAFT release; flip it to published once all
  # platforms have finished uploading their installers.
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="v$(node -p "require('./package.json').version")"
          id=$(gh api repos/${{ github.repository }}/releases --paginate \
                --jq "[.[] | select(.tag_name==\"$tag\")][0].id")
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "No release found for tag $tag"; exit 1
          fi
          gh api -X PATCH repos/${{ github.repository }}/releases/$id \
            -F draft=false -f name="UnThreader $tag" >/dev/null
          echo "Published $tag"
